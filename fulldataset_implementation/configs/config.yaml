# Configuration for Full Dataset Zero-Day Detection Pipeline (Step 10 Multi-Signal Architecture)
# Evaluates on the entire 74-file UNSW Bot-IoT dataset (73,370,443 flows)
# Leave-One-Attack-Out (LOAO) across all attack classes

experiment:
  name: fulldataset_implementation
  version: 1.0.0
  random_seed: 42
  date: "2026-10-05"
  total_raw_rows: 73370443
  total_files: 74

paths:
  workspace_dir: "d:/p01"
  full_impl_dir: "d:/p01/Iot_bot/fulldataset_implementation"
  cleaned_sample_path: "d:/p01/Iot_bot/fulldataset_implementation/data/fulldataset_cleaned_sample.parquet"
  models_dir: "d:/p01/Iot_bot/fulldataset_implementation/models"
  outputs_dir: "d:/p01/Iot_bot/fulldataset_implementation/outputs"
  reports_dir: "d:/p01/Iot_bot/fulldataset_implementation/reports"

dataset_sampling:
  # Maintain 100% of rare and minority classes from all 74 files
  retain_100_percent_classes:
    - Normal            # 9,543 total flows
    - Data_Exfiltration # 118 total flows
    - Keylogging        # 1,469 total flows
  # Balanced sampling for high-volume classes targeting ~10,000 flows each
  subsample_ratios:
    HTTP: 0.22             # ~10,800 raw -> capped to 10,000
    OS_Fingerprint: 0.032  # ~11,400 raw -> capped to 10,000
    Service_Scan: 0.0078   # ~11,400 raw -> capped to 10,000
    TCP: 0.00036           # ~11,400 raw -> capped to 10,000
    UDP: 0.00029           # ~11,400 raw -> capped to 10,000
  target_class_cap: 10000
  target_corpus_size: ~61000

features:
  excluded:
    - saddr
    - daddr
    - smac
    - dmac
    - soui
    - doui
    - sco
    - dco
    - stime
    - ltime
    - pkSeqID
    - seq
    - attack
    - category
    - subcategory

  representation_a_xgboost:
    - proto_number
    - flgs_number
    - state_number
    - sport
    - dport
    - dur
    - pkts
    - bytes
    - spkts
    - dpkts
    - sbytes
    - dbytes
    - rate
    - srate
    - drate
    - mean
    - stddev
    - sum
    - min
    - max

  representation_b_geometry:
    - proto_number
    - flgs_number
    - state_number
    - dur
    - pkts
    - bytes
    - spkts
    - dpkts
    - sbytes
    - dbytes
    - rate
    - srate
    - drate
    - mean
    - stddev
    - sum
    - min
    - max

mappings:
  proto:
    tcp: 1
    arp: 2
    udp: 3
    icmp: 4
    ipv6-icmp: 5
    other: 0
  flgs:
    e: 1
    e s: 2
    e d: 3
    e *: 4
    e g: 5
    eU: 6
    e &: 7
    e   t: 8
    e  D: 9
    e    F: 10
    e dD: 11
    e r: 12
    other: 0
  state:
    RST: 1
    CON: 2
    REQ: 3
    INT: 4
    URP: 5
    FIN: 6
    ACC: 7
    NRS: 8
    ECO: 9
    TST: 10
    MAS: 11
    PAR: 12
    other: 0

xgboost_params:
  n_estimators: 100
  max_depth: 6
  learning_rate: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
  tree_method: "hist"
  objective: "multi:softprob"
  random_state: 42
  n_jobs: -1

signals:
  epsilon: 1.0e-12
  names:
    - signal_confidence
    - signal_mahalanobis
    - signal_leaf
    - signal_relative

pseudo_unknowns:
  n_samples_per_generator: 1500
  cross_class_lambdas: [0.25, 0.50, 0.75]
  perturbation_sigmas: [1.5, 2.0]
  extrapolation_gammas: [1.5, 2.0, 2.5]
  hard_pseudo_unknown:
    n_samples: 1500
    min_confidence: 0.85
    noise_sigmas: [1.2, 1.8, 2.4]

weight_optimization:
  simplex_grid_step: 0.05
  weight_floor: 0.05
  known_acceptance_min: 0.945
  benign_rejection_max: 0.02
  loss_weights:
    lambda_balanced_f1: 1.00
    lambda_hard: 0.35
    lambda_auc: 0.25
    lambda_red: 0.15

thresholds:
  candidate_percentiles: [90.0, 92.0, 95.0, 97.0, 98.0, 99.0, 99.5]
  primary_percentile: 95.0
